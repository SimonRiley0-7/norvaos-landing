<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NORVA — macOS AI Assistant Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      /* Warm macOS mountain wallpaper CSS gradient (purples, pinks, beiges) */
      background:
        radial-gradient(ellipse 90% 80% at 80% 20%, rgba(255, 215, 185, 0.65) 0%, transparent 60%),
        radial-gradient(ellipse 70% 60% at 20% 80%, rgba(200, 180, 240, 0.7) 0%, transparent 70%),
        radial-gradient(ellipse 80% 50% at 50% 50%, rgba(245, 210, 225, 0.6) 0%, transparent 80%),
        linear-gradient(135deg, #dfd0ea 0%, #ecd3cb 35%, #eedad0 60%, #cfc4e5 100%);
      background-size: cover;
      background-position: center;
    }

    /* Ambient scenic blur layers representing misty peaks & daylight glow */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle subtle decorative mountain silhouettes in CSS */
    .mountain-silhouette {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 48%;
      background: radial-gradient(circle at 75% 40%, rgba(180, 140, 170, 0.35) 0%, transparent 60%),
                  radial-gradient(circle at 25% 60%, rgba(150, 130, 190, 0.25) 0%, transparent 65%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================================
       MAIN WRAPPER & PAGE ENTRANCE
       ============================================================ */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 38px;
      padding: 24px;
      width: 100%;
      max-width: 580px;
    }

    /* On page load: widget fades and slides up (opacity 0→1, translateY 20px→0, 600ms ease-out) */
    .entrance-anim {
      opacity: 0;
      transform: translateY(20px);
      animation: pageEntrance 600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageEntrance {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================================
       FROSTED GLASS WIDGET PANEL
       ============================================================ */
    .widget-panel {
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      padding: 22px 28px 26px;
      box-shadow:
        0 24px 60px -12px rgba(35, 25, 55, 0.16),
        0 8px 24px -6px rgba(35, 25, 55, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      /* Slow sine-wave float animation */
      animation: widgetFloat 3s ease-in-out infinite;
      transition: box-shadow 0.3s ease;
    }

    .widget-panel:hover {
      box-shadow:
        0 30px 70px -12px rgba(123, 92, 240, 0.18),
        0 12px 30px -6px rgba(35, 25, 55, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    /* Slow sine-wave translateY 3s loop */
    @keyframes widgetFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    /* ============================================================
       WIDGET HEADER (TRAFFIC LIGHTS & ⌘K BADGE)
       ============================================================ */
    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    /* Three traffic light dots */
    .traffic-lights {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .dot:hover {
      transform: scale(1.15);
    }

    .dot-red {
      background: #FF5F57;
      border: 0.5px solid rgba(224, 68, 62, 0.6);
    }

    .dot-yellow {
      background: #FEBC2E;
      border: 0.5px solid rgba(222, 161, 35, 0.6);
    }

    .dot-green {
      background: #28C840;
      border: 0.5px solid rgba(26, 171, 41, 0.6);
    }

    /* Keyboard shortcut badge (⌘K) in a pill */
    .shortcut-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: #6B6B76;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      user-select: none;
    }

    /* ============================================================
       CENTER LOGO & HEADING
       ============================================================ */
    .center-identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: -2px;
      margin-bottom: 18px;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      margin-bottom: 8px;
      filter: drop-shadow(0 3px 10px rgba(123, 92, 240, 0.35));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-mark:hover {
      transform: scale(1.08) rotate(4deg);
    }

    .heading {
      font-size: 19px;
      font-weight: 500;
      color: #17171C;
      letter-spacing: -0.015em;
    }

    /* ============================================================
       SEARCH INPUT BAR
       ============================================================ */
    .search-bar {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 52px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #E8E6E1;
      border-radius: 9999px;
      padding-left: 20px;
      padding-right: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }

    /* Soft purple glow on focus */
    .search-bar:focus-within {
      border-color: #7B5CF0;
      background: #FFFFFF;
      box-shadow:
        0 0 0 3px rgba(123, 92, 240, 0.22),
        0 4px 16px rgba(123, 92, 240, 0.08);
    }

    .search-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      color: #17171C;
      padding-right: 12px;
    }

    .search-input::placeholder {
      color: #8E8E98;
      font-weight: 400;
    }

    /* Purple gradient submit arrow button */
    .submit-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8E70FF 0%, #7B5CF0 50%, #6848E4 100%);
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(123, 92, 240, 0.35);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease, box-shadow 0.2s ease;
    }

    .submit-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.3;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* On hover: scale up, brighten, rotate arrow 45° */
    .submit-btn:hover {
      transform: scale(1.08);
      filter: brightness(1.12);
      box-shadow: 0 4px 14px rgba(123, 92, 240, 0.5);
    }

    .submit-btn:hover svg {
      transform: rotate(45deg);
    }

    .submit-btn:active {
      transform: scale(0.95);
    }

    /* ============================================================
       QUICK-ACTION CHIPS
       ============================================================ */
    .chips-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255, 255, 255, 0.70);
      border: 1px solid #E4E2DC;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: #3F3F46;
      cursor: pointer;
      user-select: none;
      /* Smooth 150ms transition */
      transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease, color 150ms ease;
    }

    .chip-btn svg {
      width: 14px;
      height: 14px;
      color: #71717A;
      transition: color 150ms ease;
    }

    /* On hover: scale up slightly (1.04), darken border, faint purple box-shadow */
    .chip-btn:hover {
      transform: scale(1.04);
      border-color: #B8B0DE;
      background: #FFFFFF;
      color: #18181B;
      box-shadow: 0 4px 12px rgba(123, 92, 240, 0.12);
    }

    .chip-btn:hover svg {
      color: #7B5CF0;
    }

    .chip-btn:active {
      transform: scale(0.98);
    }

    .chip-overflow {
      padding: 7px 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* ============================================================
       MACOS DOCK STRIP
       ============================================================ */
    .dock-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 20px;
      box-shadow:
        0 16px 36px rgba(0, 0, 0, 0.14),
        0 2px 8px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      gap: 10px;
    }

    .dock-item {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transform-origin: bottom center;
      /* Spring-like transition for magnification */
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Tooltip above dock icon */
    .dock-item::before {
      content: attr(data-name);
      position: absolute;
      top: -32px;
      background: rgba(23, 23, 28, 0.8);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      backdrop-filter: blur(8px);
    }

    .dock-item:hover::before {
      opacity: 1;
      transform: translateY(0);
    }

    /* Finder */
    .dock-finder {
      background: linear-gradient(180deg, #38A1FF 0%, #0066E0 100%);
      color: #FFFFFF;
    }

    /* Safari */
    .dock-safari {
      background: linear-gradient(180deg, #FFFFFF 0%, #E8F0FE 100%);
      color: #1A73E8;
    }

    /* Notion */
    .dock-notion {
      background: #FFFFFF;
      color: #000000;
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 22px;
    }

    /* Figma */
    .dock-figma {
      background: #1E1E1E;
    }

    /* Calendar */
    .dock-calendar {
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 0.5px solid rgba(0, 0, 0, 0.08);
    }

    .cal-header {
      width: 100%;
      height: 12px;
      background: #E02E2E;
      color: #FFFFFF;
      font-size: 7.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.05em;
    }

    .cal-date {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      color: #17171C;
      line-height: 1;
    }

    /* Mail */
    .dock-mail {
      background: linear-gradient(180deg, #2499FF 0%, #006CE0 100%);
      color: #FFFFFF;
    }

    /* Subtle active dot under dock icons */
    .dock-dot {
      position: absolute;
      bottom: -6px;
      width: 3.5px;
      height: 3.5px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 50%;
    }

    /* ============================================================
       INTERACTIVE FEEDBACK TOAST (Demonstration)
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 24px;
      padding: 10px 18px;
      border-radius: 9999px;
      background: rgba(23, 23, 28, 0.85);
      backdrop-filter: blur(12px);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Ambient mountain silhouette gradient -->
  <div class="mountain-silhouette"></div>

  <div class="container entrance-anim">

    <!-- =========================================================
         FROSTED GLASS WIDGET PANEL
         ========================================================= -->
    <div class="widget-panel" id="widget">

      <!-- Traffic lights & Shortcut pill -->
      <div class="widget-header">
        <div class="traffic-lights">
          <div class="dot dot-red" title="Close"></div>
          <div class="dot dot-yellow" title="Minimize"></div>
          <div class="dot dot-green" title="Zoom"></div>
        </div>

        <div class="shortcut-badge" title="Shortcut to summon NORVA">
          <span>⌘</span><span>K</span>
        </div>
      </div>

      <!-- Center Logo & Heading -->
      <div class="center-identity">
        <!-- Purple Ribbon "N" Logo SVG -->
        <svg class="logo-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="widget-norva-grad" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stopColor="#6C4BE8" />
              <stop offset="50%" stopColor="#7B5CF0" />
              <stop offset="100%" stopColor="#A58BFF" />
            </linearGradient>
            <linearGradient id="widget-norva-grad-2" x1="20" y1="20" x2="48" y2="48" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stopColor="#A58BFF" />
              <stop offset="70%" stopColor="#7B5CF0" />
              <stop offset="100%" stopColor="#5E3EDC" />
            </linearGradient>
          </defs>
          <path
            d="M 16 46 C 11 41 11 31 17 25 C 22 20 29 20 34 25 L 46 38 C 51 43 51 49 46 53 C 41 57 34 56 29 50 L 18 36"
            stroke="url(#widget-norva-grad)"
            stroke-width="9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M 28 34 L 38 22 C 43 16 51 16 55 21 C 59 26 58 34 52 40 L 40 52"
            stroke="url(#widget-norva-grad-2)"
            stroke-width="8.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="36" cy="27" r="2.5" fill="#E0D7FF" opacity="0.9" />
        </svg>

        <h2 class="heading">What would you like to do?</h2>
      </div>

      <!-- Search Input Bar -->
      <form class="search-bar" id="searchForm">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Ask NORVA anything…"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" class="submit-btn" id="submitBtn" title="Run command">
          <!-- Up-right diagonal arrow icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </button>
      </form>

      <!-- Three Quick-Action Chips + Overflow Chip -->
      <div class="chips-row">
        <!-- 1. Find files -->
        <button type="button" class="chip-btn" data-prompt="Find my recent documents">
          <!-- File icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Find files</span>
        </button>

        <!-- 2. Plan my day -->
        <button type="button" class="chip-btn" data-prompt="Plan my day">
          <!-- Calendar icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Plan my day</span>
        </button>

        <!-- 3. Draft an email -->
        <button type="button" class="chip-btn" data-prompt="Draft an email to the team">
          <!-- Envelope / Mail icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <span>Draft an email</span>
        </button>

        <!-- 4. Overflow chip -->
        <button type="button" class="chip-btn chip-overflow" data-prompt="Organize my desktop files" title="More quick actions">
          <span>···</span>
        </button>
      </div>

    </div>

    <!-- =========================================================
         MACOS DOCK STRIP
         ========================================================= -->
    <div class="dock-container" id="dock">
      <!-- 1. Finder -->
      <div class="dock-item dock-finder" data-name="Finder">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span class="dock-dot"></span>
      </div>

      <!-- 2. Safari -->
      <div class="dock-item dock-safari" data-name="Safari">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
        <span class="dock-dot"></span>
      </div>

      <!-- 3. Notion -->
      <div class="dock-item dock-notion" data-name="Notion">
        <span>N</span>
      </div>

      <!-- 4. Figma -->
      <div class="dock-item dock-figma" data-name="Figma">
        <svg width="18" height="27" viewBox="0 0 38 57" fill="none">
          <path d="M19 28.5C19 23.2533 23.2533 19 28.5 19C33.7467 19 38 23.2533 38 28.5C38 33.7467 33.7467 38 28.5 38C23.2533 38 19 33.7467 19 28.5Z" fill="#1ABCFE"/>
          <path d="M0 47.5C0 42.2533 4.25329 38 9.5 38H19V47.5C19 52.7467 14.7467 57 9.5 57C4.25329 57 0 52.7467 0 47.5Z" fill="#0ACF83"/>
          <path d="M19 0V19H28.5C33.7467 19 38 14.7467 38 9.5C38 4.25329 33.7467 0 28.5 0H19Z" fill="#FF7262"/>
          <path d="M0 9.5C0 14.7467 4.25329 19 9.5 19H19V0H9.5C4.25329 0 0 4.25329 0 9.5Z" fill="#F24E1E"/>
          <path d="M0 28.5C0 33.7467 4.25329 38 9.5 38H19V19H9.5C4.25329 19 0 23.2533 0 28.5Z" fill="#A259FF"/>
        </svg>
      </div>

      <!-- 5. Calendar -->
      <div class="dock-item dock-calendar" data-name="Calendar">
        <div class="cal-header">JUN</div>
        <div class="cal-date">10</div>
        <span class="dock-dot"></span>
      </div>

      <!-- 6. Mail -->
      <div class="dock-item dock-mail" data-name="Mail">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <span class="dock-dot"></span>
      </div>
    </div>

  </div>

  <!-- Interactive toast confirmation -->
  <div class="toast" id="toast"></div>

  <!-- ============================================================
       INTERACTION SCRIPTS (MAGNIFICATION, CHIPS, SEARCH)
       ============================================================ -->
  <script>
    // --- 1. macOS Dock Magnification Simulation ---
    const dock = document.getElementById('dock');
    const dockItems = Array.from(document.querySelectorAll('.dock-item'));
    const MAX_DISTANCE = 110; // Influence radius in pixels
    const MAX_SCALE = 1.30;   // Peak magnification for direct hover

    dock.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX;

      dockItems.forEach((item) => {
        const rect = item.getBoundingClientRect();
        const itemCenterX = rect.left + rect.width / 2;
        const distance = Math.abs(mouseX - itemCenterX);

        if (distance < MAX_DISTANCE) {
          // Cosine curve for authentic Apple magnification wave
          const normDist = distance / MAX_DISTANCE;
          const scaleBoost = (Math.cos(normDist * Math.PI) + 1) / 2; // 0 to 1
          const scale = 1 + (MAX_SCALE - 1) * scaleBoost;
          const translateY = -((scale - 1) * 16);
          item.style.transform = `scale(${scale.toFixed(3)}) translateY(${translateY.toFixed(1)}px)`;
        } else {
          item.style.transform = 'scale(1) translateY(0)';
        }
      });
    });

    dock.addEventListener('mouseleave', () => {
      dockItems.forEach((item) => {
        item.style.transform = 'scale(1) translateY(0)';
      });
    });

    // --- 2. Quick-Action Chips & Submit Handling ---
    const searchInput = document.getElementById('searchInput');
    const searchForm = document.getElementById('searchForm');
    const chipButtons = document.querySelectorAll('.chip-btn');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    chipButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const prompt = btn.getAttribute('data-prompt');
        searchInput.value = prompt;
        searchInput.focus();
        showToast(`Running "${prompt}"...`);
      });
    });

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = searchInput.value.trim();
      if (!val) {
        searchInput.focus();
        return;
      }
      showToast(`NORVA is processing: "${val}"`);
    });

    dockItems.forEach((item) => {
      item.addEventListener('click', () => {
        const appName = item.getAttribute('data-name');
        showToast(`Opening ${appName}...`);
      });
    });
  </script>
</body>
</html>
